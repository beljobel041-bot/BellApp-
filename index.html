<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BellApp Video 🔥</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{margin:0;background:black;overflow:hidden}
.snap-y{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}
.snap{scroll-snap-align:start;height:100vh;position:relative}
video{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body class="text-white">
<div class="fixed top-0 w-full z-50 bg-[#7c3aed] p-3 flex justify-between items-center">
  <b>BellApp 🔔</b><span>🔍 🔔</span>
</div>
<div class="snap-y pt-12 pb-16">
  <div class="snap">
    <video loop autoplay muted playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
    <div class="absolute bottom-0 p-4 w-full bg-gradient-to-t from-black to-transparent">
      <p class="font-bold">Carlos M. • Beira 📍</p>
      <p class="text-sm">😂 Esse é bem da Beira mesmo! #humor</p>
      <p>💜 2.4K 💬 137 ↗️ 42</p>
    </div>
    <div class="absolute right-3 bottom-24 flex flex-col gap-5 text-2xl">
      <div class="bg-white/20 p-3 rounded-full">💜</div>
      <div class="bg-white/20 p-3 rounded-full">💬</div>
      <div class="bg-white/20 p-3 rounded-full">↗️</div>
    </div>
  </div>
  <div class="snap">
    <video loop autoplay muted playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
    <div class="absolute bottom-0 p-4 w-full bg-gradient-to-t from-black to-transparent">
      <p class="font-bold">Amina R. • Beira</p>
      <p class="text-sm">Dança nova! Quem faz melhor? 🔥</p>
      <p>💜 5.1K 💬 302</p>
    </div>
  </div>
  <div class="snap">
    <video loop autoplay muted playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"></video>
    <div class="absolute bottom-0 p-4 w-full bg-gradient-to-t from-black to-transparent">
      <p class="font-bold">Tu • Beira</p>
      <p class="text-sm">Meu primeiro vício no BellApp! 🎉</p>
      <p>💜 0 💬 0</p>
    </div>
  </div>
</div>
<div class="fixed bottom-0 w-full bg-white text-black flex justify-around p-3 rounded-t-2xl z-50">
  <div class="text-center"><div class="text-xl">🏠</div><div class="text-xs font-bold text-[#7c3aed]">Vícios</div></div>
  <div class="text-center"><div class="text-xl">🔔</div><div class="text-xs">Campainha</div></div>
  <div class="text-center"><div class="text-xl">💬</div><div class="text-xs">Mensagem</div></div>
</div>
<script>
document.querySelectorAll('video').forEach(v=>{v.addEventListener('click',()=>v.paused?v.play():v.pause())})
</script>
</body>
      </html>
