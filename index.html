<div id="auth" class="auth">
<h1>BellApp 🔔</h1><p style="color:#777">Conta do Dono Oficial</p>
<div class="tabs"><div id="tE" onclick="setTab('E')">Email</div><div id="tP" class="on" onclick="setTab('P')">Número</div></div>

<div id="bP"><div style="display:flex;gap:8px"><select id="cc" class="input" style="width:120px"><option value="+258">🇲🇿 +258</option><option value="+55">🇧🇷 +55</option><option value="+351">🇵🇹 +351</option><option value="+27">🇿🇦 +27</option><option value="+1">🇺🇸 +1</option></select><input id="phone" class="input" style="flex:1" value="869116478"></div><p style="color:#00aaff;font-size:11px;margin-top:8px">👑 Número oficial: 869116478 = BellApp oficial ✅</p></div>

<div id="otpS" class="otp"><h2>Verificação Dono 👑</h2><b id="otpT" style="margin-top:8px;display:block;color:#00aaff"></b><div id="otpCode" style="background:#fff;color:#000;padding:14px;border-radius:10px;text-align:center;margin-top:14px;font-weight:700;letter-spacing:5px;font-size:22px">------</div><input id="otpI" class="input" style="text-align:center;letter-spacing:12px;font-size:22px;font-weight:700" maxlength="6" placeholder="000000"><p id="otpE" style="color:#f55;display:none;margin-top:8px"></p><button class="btn" onclick="verOtp()">Confirmar e virar oficial ✅</button></div>
<script>
const DONO='869116478';
let tab='P',tmp=null,otp='',user=JSON.parse(localStorage.getItem('bell_u')||'null'),posts=JSON.parse(localStorage.getItem('bell_p')||'[]'),atvs=JSON.parse(localStorage.getItem('bell_a')||'[]'),chats=JSON.parse(localStorage.getItem('bell_c')||'[]');
function isOff(u){if(!u)return false;let f=(u.full||'').replace(/[^0-9]/g,'');return f.includes(DONO);}
function setTab(t){tab=t;document.getElementById('tE').className=t=='E'?'on':'';document.getElementById('tP').className=t=='P'?'on':'';document.getElementById('bE').style.display=t=='E'?'block':'none';document.getElementById('bP').style.display=t=='P'?'block':'none'}
function showP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+id).classList.add('active');document.querySelectorAll('.b-item').forEach(b=>b.classList.remove('on'));let el=document.getElementById('b-'+id);if(el)el.classList.add('on');if(id=='home')rH();if(id=='msg')rM();if(id=='profile')rProf()}
function setM(t){document.getElementById('tA').className=t=='A'?'on':'';document.getElementById('tC').className=t=='C'?'on':'';document.getElementById('lA').style.display=t=='A'?'block':'none';document.getElementById('lC').style.display=t=='C'?'block':'none'}
function doAuth(){let p=document.getElementById('pass').value,er=document.getElementById('err');if(!/^\d{6}$/.test(p)){er.style.display='block';er.textContent='Senha OBRIGATÓRIA 6 NÚMEROS!';return}let cc=document.getElementById('cc').value,ph=document.getElementById('phone').value.trim();let full=cc+' '+ph;if(ph.replace(/[^0-9]/g,'').includes(DONO)){tmp={name:'BellApp oficial',full:full,owner:true}}else{tmp={name:full,full:full,owner:false}}otp=Math.floor(100000+Math.random()*900000).toString();document.getElementById('otpT').textContent=full+(tmp.owner?' 👑 DONO':'');document.getElementById('otpCode').textContent=otp;document.getElementById('otpS').style.display='flex';}
function verOtp(){let i=document.getElementById('otpI').value,e=document.getElementById('otpE');if(i!==otp){e.style.display='block';e.textContent='Código errado! Certo: '+otp;return}finish()}
function finish(){user=tmp;localStorage.setItem('bell_u',JSON.stringify(user));document.getElementById('auth').style.display='none';document.getElementById('otpS').style.display='none';rProf();rH();showP('profile');}
function rProf(){if(!user)return;let off=isOff(user)||user.owner;document.getElementById('pN').innerHTML=(off?'BellApp oficial':'Visitante')+(off?' <span class=badge>✓</span> 👑':'');document.getElementById('pH').textContent=user.full;document.getElementById('offBadge').style.display=off?'block':'none';}
function rH(){let c=document.getElementById('p-home');if(posts.length==0){c.innerHTML='<div style=height:70%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#555;padding:30px;text-align:center'><div style=font-size:60px>👑</div><h3 style=color:#fff>App limpa</h3><button style=background:#fff;color:#000;border:0;padding:12px 20px;border-radius:20px;margin-top:12px;font-weight:700 onclick=cP()>+ Postar</button></div>';return}c.innerHTML=posts.map(p=>'<div style=padding:14px;border-bottom:1px solid #111><b>'+p.user+'</b><div>'+p.text+'</div></div>').join('')}
function cP(){let t=prompt('Post:');if(!t)return;posts.unshift({user:user.name,text:t});localStorage.setItem('bell_p',JSON.stringify(posts));rH();}
function rM(){document.getElementById('lA').innerHTML=atvs.length?atvs.map(a=>'<div class=item><div class=avatar>🔔</div><div><b>Atividade</b><div style=color:#aaa;font-size:13px>'+a.text+'</div></div></div>').join(''):'<div style=text-align:center;padding:40px;color:#555>🔔 Nenhuma atividade</div>';document.getElementById('lC').innerHTML=chats.length?chats.map(c=>'<div class=item><div class=avatar>👤</div><div style=flex:1><b>'+c.name+'</b><span style=color:#555;font-size:11px> '+c.time+'</span><div style=color:#888;font-size:13px>'+c.msg+'</div></div></div>').join(''):'<div style=text-align:center;padding:40px;color:#555>💬 Vazio - ex beljo a 1h</div>';}
function doSearch(q){let r=document.getElementById('sR'),e=document.getElementById('exList');let h='<div style=color:#555>Digita...</div>';if(r)r.innerHTML=h;if(e)e.innerHTML=h;}
function logout(){localStorage.removeItem('bell_u');location.reload()}
if(user){document.getElementById('auth').style.display='none';rProf()}rH();rM();
</script>
