<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BellApp</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui;outline:none;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;height:100vh;overflow:hidden}
.screen{display:none;height:100vh;padding:16px;overflow-y:auto}.screen.on{display:flex;flex-direction:column}
.input{width:100%;padding:14px;border-radius:12px;margin-top:12px;background:#151515;border:1px solid #333;color:#fff;font-size:16px}
.btn{width:100%;padding:15px;border-radius:30px;background:#fff;color:#000;font-weight:900;border:0;margin-top:16px;font-size:16px}
.btn2{padding:10px 14px;border-radius:20px;background:#222;color:#fff;border:1px solid #444}
.box{border:1px solid #1a1a1a;border-radius:16px;padding:14px;margin-top:14px;background:#0a0a0a}
.top{height:50px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #1a1a1a;font-weight:900}
.bottom{height:60px;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;background:#000;position:fixed;bottom:0;left:0;right:0}
.b{color:#666;text-align:center;flex:1;font-size:11px;cursor:pointer}.b.on{color:#fff}.b span{font-size:22px;display:block}
#app{display:none;height:100vh;flex-direction:column}
.feed{flex:1;overflow-y:auto;padding-bottom:70px}
.vcard{background:#111;border-radius:12px;padding:12px;margin:10px 0}
</style></head><body>

<!-- TELA 0 - ÍCONE ABRIU - CRIAR CONTA / RECUPERAR -->
<div id="s0" class="screen on" style="justify-content:center">
<h1 style="text-align:center">BellApp 🔔</h1>
<p style="text-align:center;color:#666;font-size:12px;margin-top:6px">Bem-vindo - App nova</p>
<button class="btn" onclick="go('s1')">Criar conta</button>
<p style="text-align:center;margin-top:18px;color:#888;font-size:13px" onclick="go('sRec')">Recuperar conta</p>
</div>

<div id="sRec" class="screen"><div class="top">Recuperar conta</div><input id="recNum" class="input" placeholder="Número ou email que usaste"><input id="recPass" class="input" type="password" placeholder="Senha"><button class="btn" onclick="entrar()">Entrar</button><p style="text-align:center;color:#666;margin-top:12px" onclick="go('s0')">Voltar</p></div>

<!-- TELA 1 - 1º NOME 2º DATA 3º NÚMERO MUNDO TODO -->
<div id="s1" class="screen"><div class="top">1º Criar Conta</div>
<div class="box">
<span style="font-size:11px;color:#666">1º NOME E APELIDO</span>
<input id="nome" class="input" placeholder="Nome e apelido">
<span style="font-size:11px;color:#666;margin-top:12px;display:block">2º DATA DE NASCIMENTO</span>
<input id="data" class="input" type="date">
<span style="font-size:11px;color:#666;margin-top:12px;display:block">3º NÚMERO DE TELEFONE OU EMAIL - TODOS PAÍSES DO MUNDO</span>
<select id="cc" class="input">
<option value="+258">🇲🇿 Moçambique +258</option>
<option value="+93">🇦🇫 Afeganistão +93</option><option value="+355">🇦🇱 Albânia +355</option><option value="+213">🇩🇿 Argélia +213</option><option value="+376">🇦🇩 Andorra +376</option><option value="+244">🇦🇴 Angola +244</option><option value="+54">🇦🇷 Argentina +54</option><option value="+374">🇦🇲 Arménia +374</option><option value="+61">🇦🇺 Austrália +61</option><option value="+43">🇦🇹 Áustria +43</option><option value="+994">🇦🇿 Azerbaijão +994</option><option value="+973">🇧🇭 Bahrein +973</option><option value="+880">🇧🇩 Bangladesh +880</option><option value="+375">🇧🇾 Bielorrússia +375</option><option value="+32">🇧🇪 Bélgica +32</option><option value="+501">🇧🇿 Belize +501</option><option value="+229">🇧🇯 Benim +229</option><option value="+975">🇧🇹 Butão +975</option><option value="+591">🇧🇴 Bolívia +591</option><option value="+387">🇧🇦 Bósnia +387</option><option value="+267">🇧🇼 Botsuana +267</option><option value="+55">🇧🇷 Brasil +55</option><option value="+359">🇧🇬 Bulgária +359</option><option value="+226">🇧🇫 Burkina +226</option><option value="+257">🇧🇮 Burundi +257</option><option value="+855">🇰🇭 Camboja +855</option><option value="+237">🇨🇲 Camarões +237</option><option value="+1">🇨🇦 Canadá +1</option><option value="+238">🇨🇻 Cabo Verde +238</option><option value="+56">🇨🇱 Chile +56</option><option value="+86">🇨🇳 China +86</option><option value="+57">🇨🇴 Colômbia +57</option><option value="+242">🇨🇬 Congo +242</option><option value="+243">🇨🇩 Congo RDC +243</option><option value="+506">🇨🇷 Costa Rica +506</option><option value="+385">🇭🇷 Croácia +385</option><option value="+53">🇨🇺 Cuba +53</option><option value="+45">🇩🇰 Dinamarca +45</option><option value="+20">🇪🇬 Egito +20</option><option value="+503">🇸🇻 El Salvador +503</option><option value="+33">🇫🇷 França +33</option><option value="+49">🇩🇪 Alemanha +49</option><option value="+233">🇬🇭 Gana +233</option><option value="+30">🇬🇷 Grécia +30</option><option value="+502">🇬🇹 Guatemala +502</option><option value="+245">🇬🇼 Guiné-Bissau +245</option><option value="+91">🇮🇳 Índia +91</option><option value="+62">🇮🇩 Indonésia +62</option><option value="+353">🇮🇪 Irlanda +353</option><option value="+972">🇮🇱 Israel +972</option><option value="+39">🇮🇹 Itália +39</option><option value="+81">🇯🇵 Japão +81</option><option value="+254">🇰🇪 Quênia +254</option><option value="+351">🇵🇹 Portugal +351</option><option value="+27">🇿🇦 África do Sul +27</option><option value="+34">🇪🇸 Espanha +34</option><option value="+46">🇸🇪 Suécia +46</option><option value="+41">🇨🇭 Suíça +41</option><option value="+255">🇹🇿 Tanzânia +255</option><option value="+66">🇹🇭 Tailândia +66</option><option value="+90">🇹🇷 Turquia +90</option><option value="+44">🇬🇧 Reino Unido +44</option><option value="+1">🇺🇸 EUA +1</option><option value="+260">🇿🇲 Zâmbia +260</option><option value="+263">🇿🇼 Zimbábue +263</option>
</select>
<input id="phone" class="input" placeholder="Número de telefone">
<input id="email" class="input" placeholder="OU Email - beljo@gmail.com">
</div>
<button class="btn" onclick="go('s2')">Próximo →</button>
</div>

<!-- TELA 2 - SENHA 6 DÍGITOS - INICIAR -->
<div id="s2" class="screen"><div class="top">Senha</div>
<div class="box">
<span style="font-size:11px;color:#666">SENHA NO MÁXIMO 6 DÍGITOS</span>
<input id="pass" class="input" type="password" maxlength="6" placeholder="Senha máx 6 dígitos - ex: 123456">
<div style="display:flex;gap:10px;margin-top:12px"><img id="prev" style="width:60px;height:60px;border-radius:50%;display:none;object-fit:cover"><label class="btn2">📷 Foto<input id="foto" type="file" hidden accept="image/*"></label></div>
</div>
<p id="err" style="color:#ff4444;display:none;margin-top:10px"></p>
<button class="btn" onclick="criar()">Iniciar</button>
<p style="text-align:center;color:#666;margin-top:12px" onclick="go('s1')">Voltar</p>
</div>

<!-- APP PRINCIPAL COM 4 ABAS EMBAIXO HORIZONTAL -->
<div id="app">
<div class="feed" id="feedHome"></div>
<div class="feed" id="feedExp" style="display:none">
<div style="padding:10px;display:flex;gap:8px;align-items:center;background:#111;margin:10px;border-radius:12px"><span>🔍</span><input id="search" class="input" style="margin:0;border:0;background:transparent" placeholder="Pesquisar alguém..." oninput="pesquisar()"></div>
<div id="expRes"></div>
</div>
<div class="feed" id="feedPlus" style="display:none;padding:16px"><h3>Criar vídeo +</h3><input id="leg" class="input" placeholder="Legenda..."><button class="btn" onclick="postar()">Postar vídeo</button></div>
<div class="feed" id="feedPerfil" style="display:none"></div>

<div class="bottom">
<div class="b on" id="b-home" onclick="tab('home')"><span>⌂</span>Casinha</div>
<div class="b" id="b-exp" onclick="tab('exp')"><span>🧭</span>Explorar</div>
<div class="b" id="b-plus" onclick="tab('plus')"><span style="background:#fff;color:#000;width:30px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center">+</span>Criar</div>
<div class="b" id="b-perfil" onclick="tab('perfil')"><span>👤</span>Perfil</div>
</div>
</div>

<script>
let foto=null,current=null,users=JSON.parse(localStorage.getItem('bell_simple')||'[]'),posts=[];
document.getElementById('foto').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=v=>{foto=v.target.result;document.getElementById('prev').src=foto;document.getElementById('prev').style.display='block';};r.readAsDataURL(f);};
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}
function criar(){
let n=document.getElementById('nome').value.trim(),d=document.getElementById('data').value,ph=document.getElementById('phone').value.replace(/\D/g,''),em=document.getElementById('email').value.trim().toLowerCase(),cc=document.getElementById('cc').value,pw=document.getElementById('pass').value,err=document.getElementById('err');
err.style.display='none';
if(n.length<2){err.textContent='Escreve nome e apelido';err.style.display='block';return;}
if(!d){err.textContent='Escolhe data nascimento';err.style.display='block';return;}
if(pw.length>6||pw.length<1){err.textContent='Senha máximo 6 dígitos';err.style.display='block';return;}
if(!foto){err.textContent='Escolhe foto';err.style.display='block';return;}
let full='',idc='';if(ph.length>=7){full=cc+' '+ph;idc=ph;}else if(em.includes('@')){full=em;idc=em;}else{err.textContent='Número ou email';err.style.display='block';return;}
let isBoss=idc.includes('869116478');
let novo={id:Date.now(),name:n,data:d,full:full,idc:idc,foto:foto,pass:pw,boss:isBoss,seguidores:isBoss?15000:0,seguindo:0};
users.push(novo);localStorage.setItem('bell_simple',JSON.stringify(users));open(novo);
}
function open(u){current=u;document.querySelectorAll('.screen').forEach(s=>s.style.display='none');document.getElementById('app').style.display='flex';posts=JSON.parse(localStorage.getItem('posts_'+u.id)||'[]');tab('home');renderPerfil();}
function tab(t){
document.querySelectorAll('.feed').forEach(f=>f.style.display='none');
document.querySelectorAll('.b').forEach(b=>b.classList.remove('on'));
document.getElementById('feed'+t.charAt(0).toUpperCase()+t.slice(1)).style.display='block';
document.getElementById('b-'+t).classList.add('on');
if(t=='home')renderHome();
if(t=='perfil')renderPerfil();
if(t=='exp')renderExp();
}
function renderHome(){
let el=document.getElementById('feedHome');
if(posts.length==0){el.innerHTML=`<div style="padding:40px;text-align:center;color:#666"><div style="font-size:50px">⌂</div><h3>Página inicial - Casinha</h3><p style="margin-top:10px">Nenhum vídeo ainda pk é APP nova e não publicaram nada<br>Desliza pra cima pra mudar de vídeo (quando tiver)</p></div>`;return;}
el.innerHTML=posts.map((p,i)=>`<div class="vcard" ontouchstart="this.sy=event.touches[0].clientY" ontouchend="if(this.sy-event.changedTouches[0].clientY>50)nextV(${i})"><div style="height:300px;background:#222;border-radius:12px;display:flex;align-items:center;justify-content:center">🎬 ${p.leg}</div><p style="margin-top:8px">${p.leg}</p><div style="display:flex;gap:8px;margin-top:8px"><button class="btn2" onclick="like(${i})">❤️ ${p.likes||0} Gostar</button><button class="btn2" onclick="comment(${i})">💬 Comentar</button><button class="btn2" onclick="share(${i})">↗️ Partilhar</button><button class="btn2" onclick="saveFav(${i})">🔖 Favoritos</button></div></div>`).join('');
}
function renderExp(){
let el=document.getElementById('expRes');
if(posts.length==0){el.innerHTML=`<div style="padding:20px;text-align:center;color:#666">Nenhum vídeo publicado ainda - App nova<br>Quando alguém publicar aparece aqui</div>`;return;}
el.innerHTML=posts.map((p,i)=>`<div class="vcard" onclick="verPerfil()"><b>${p.leg}</b><div style="height:150px;background:#222;border-radius:10px;margin-top:6px;display:flex;align-items:center;justify-content:center">🎬</div></div>`).join('');
}
function renderPerfil(){
let el=document.getElementById('feedPerfil');
let vazio=posts.length==0?`<div style="padding:30px;text-align:center;color:#666;border:1px dashed #333;border-radius:12px;margin-top:16px">Vazio<br><span style="font-size:11px">Essa pessoa não postou nada ainda</span></div>`:`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:12px">${posts.map(p=>`<div style="aspect-ratio:1;background:#111;display:flex;align-items:center;justify-content:center">🎬</div>`).join('')}</div>`;
let bossTxt=current.boss?'👑 Boss - Selo Original - Número escondido pra estrangeiro':'';
el.innerHTML=`<div style="text-align:center;padding:16px"><img src="${current.foto}" style="width:80px;height:80px;border-radius:50%"><h3 style="margin-top:8px">${current.name}</h3><p style="font-size:11px;color:#666">${current.boss?'Boss - Dono BellApp':current.full}</p><p style="font-size:11px;color:#555">${bossTxt}</p><div style="display:flex;justify-content:center;gap:20px;margin-top:12px"><span><b id="segNum">${current.seguidores}</b><br><span style="font-size:11px;color:#666">Seguidores</span></span><span><b>${current.seguindo}</b><br><span style="font-size:11px;color:#666">Seguindo</span></span></div></div>${vazio}`;
}
function postar(){let l=document.getElementById('leg').value.trim()||'Meu vídeo';posts.unshift({leg:l,likes:0,comments:[]});localStorage.setItem('posts_'+current.id,JSON.stringify(posts));document.getElementById('leg').value='';tab('home');}
function pesquisar(){
let q=document.getElementById('search').value.toLowerCase();
if(!q){renderExp();return;}
let ach=users.filter(u=>u.name.toLowerCase().includes(q));
document.getElementById('expRes').innerHTML=ach.map(u=>`<div class="vcard" style="display:flex;gap:10px;align-items:center"><img src="${u.foto}" style="width:50px;height:50px;border-radius:50%"><div style="flex:1"><b>${u.name} ${u.boss?'👑':''}</b><br><span style="font-size:11px;color:#666">${u.seguidores} seguidores</span></div><button class="btn2" style="background:#0095f6;border:0;color:#fff" onclick="seguirUser(${u.id})">Seguir</button><span style="font-size:11px;color:#666;margin-left:8px">${u.seguidores} seguidores</span></div><div style="margin-top:8px">${(JSON.parse(localStorage.getItem('posts_'+u.id)||'[]')).map(p=>`<div class="vcard"><div style="height:120px;background:#222;border-radius:10px;display:flex;align-items:center;justify-content:center">🎬 ${p.leg}</div><div style="display:flex;gap:6px;margin-top:6px"><button class="btn2" onclick="likeOther(${u.id},0)">❤️ Gostar</button><button class="btn2">🔖 Favoritos</button><button class="btn2">↗️ Partilhar</button><button class="btn2">💬 Comentar</button></div></div>`).join('')||'<p style="color:#666;font-size:12px;text-align:center">Vazio - não postou nada</p>'}</div>`).join('')||'<p style="text-align:center;color:#666">Ninguém encontrado</p>';
}
function seguirUser(id){
let u=users.find(x=>x.id==id);if(!u)return;u.seguidores++;localStorage.setItem('bell_simple',JSON.stringify(users));if(current.id==id)current.seguidores++;document.getElementById('segNum')&&(document.getElementById('segNum').textContent=current.seguidores);pesquisar();alert('Seguiste - contou nos seguidores!');
}
function like(i){posts[i].likes=(posts[i].likes||0)+1;localStorage.setItem('posts_'+current.id,JSON.stringify(posts));renderHome();}
function comment(i){let c=prompt('Comentar:');if(!c)return;posts[i].comments.push(c);localStorage.setItem('posts_'+current.id,JSON.stringify(posts));alert('Comentado!');}
function share(){alert('Partilhado! Copiar link + WhatsApp');}
function saveFav(){alert('Guardado aos favoritos!');}
function entrar(){let num=document.getElementById('recNum').value.trim().toLowerCase(),p=document.getElementById('recPass').value;let ach=users.find(u=>u.full.toLowerCase()==num||u.idc.toLowerCase()==num);if(!ach)return alert('Não existe');if(ach.pass!=p)return alert('Senha errada');open(ach);}
</script>
</body></html>
