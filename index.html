<script>
const DONO='869116478';
let modo='phone',fotoBase=null,codigoRec='',viewingId=null,recUser=null,editFotoBase=null,storyFotoBase=null,shareId=null;
let users=JSON.parse(localStorage.getItem('bell_users')||'[]');
let user=JSON.parse(localStorage.getItem('bell_u')||'null');
let videos=JSON.parse(localStorage.getItem('bell_vids')||'[]');
let stories=JSON.parse(localStorage.getItem('bell_stories')||'[]');
let atividades=JSON.parse(localStorage.getItem('bell_acts')||'[]');
let follows=JSON.parse(localStorage.getItem('bell_follows')||'[]');
function setTab(t){modo=t;document.getElementById('tabPhone').className=t=='phone'?'on':'';document.getElementById('tabEmail').className=t=='email'?'on':'';document.getElementById('boxPhone').style.display=t=='phone'?'block':'none';document.getElementById('boxEmail').style.display=t=='email'?'block':'none';}
function loadFoto(i){let r=new FileReader();r.onload=e=>{fotoBase=e.target.result;document.getElementById('prevAv').src=fotoBase;document.getElementById('prevAv').style.display='block'};r.readAsDataURL(i.files[0]);}
function loadEditFoto(i){let r=new FileReader();r.onload=e=>{editFotoBase=e.target.result;document.getElementById('editAvPrev').src=editFotoBase};r.readAsDataURL(i.files[0]);}
function loadStoryFoto(i){let r=new FileReader();r.onload=e=>{storyFotoBase=e.target.result;document.getElementById('editStoryPrev').src=storyFotoBase;document.getElementById('editStoryPrev').style.display='block'};r.readAsDataURL(i.files[0]);}
function showP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+id).classList.add('active');document.querySelectorAll('.b-item').forEach(b=>b.classList.remove('on'));let el=document.getElementById('b-'+id);if(el)el.classList.add('on');if(id=='home')renderHome();if(id=='profile')renderProfile(viewingId?users.find(u=>u.id==viewingId):user);if(id=='relogio')renderRelogio();if(id=='msg')renderMsg();}
function viewOwn(){viewingId=user?user.id:null;showP('profile');}
function openSearch(){document.getElementById('lupaModal').style.display='flex';}function closeLupa(){document.getElementById('lupaModal').style.display='none';}
function openPublish(){if(!user)return;document.getElementById('pubModal').style.display='flex';}function closePub(){document.getElementById('pubModal').style.display='none';}
function openEdit(){document.getElementById('editModal').style.display='flex';document.getElementById('editNome').value=user.name;document.getElementById('editBio').value=user.bio||'';document.getElementById('editAvPrev').src=user.foto;
