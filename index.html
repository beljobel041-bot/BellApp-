<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BellApp - Beira</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{height:50px;background:#000;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.screen{flex:1;overflow:hidden;position:relative}
.page{display:none;height:100%;overflow-y:auto}.page.active{display:block}
.bottom{height:62px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center}
.b-item{color:#666;font-size:10px;text-align:center;flex:1;padding:6px 0}.b-item.on{color:#fff}.b-item i{font-size:22px;display:block;font-style:normal}
.auth{position:fixed;inset:0;background:#000;z-index:99;padding:20px;overflow:auto}
.input{width:100%;background:#111;border:1px solid #222;color:#fff;padding:14px;border-radius:12px;margin-top:12px;font-size:16px}
.tabs{display:flex;background:#111;border-radius:12px;padding:4px;margin-top:18px}.tabs div{flex:1;text-align:center;padding:11px;border-radius:8px;color:#666;font-weight:600}.tabs div.on{background:#fff;color:#000}
.btn{background:#fff;color:#000;border:0;padding:14px;border-radius:22px;font-weight:700;width:100%;margin-top:16px}
.item{padding:14px 16px;border-bottom:1px solid #0f0f0f;display:flex;gap:12px;align-items:center}
.avatar{width:42px;height:42px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.otp{position:fixed;inset:0;background:#000;z-index:200;padding:20px;display:none;flex-direction:column}
.mTabs{display:flex;gap:8px;padding:12px 16px}.mTabs div{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;background:#111;color:#666;border:1px solid #222}.mTabs div.on{background:#fff;color:#000}
</style>
</head>
<body>
<div class="top"><b>BellApp 🔔</b><span onclick="showP('search')">🔍</span></div>
<div class="screen">
<div id="p-home" class="page active"></div>
<div id="p-explore" class="page"><div style="padding:12px"><input id="sEx" class="input" style="margin:0" placeholder="Pesquisar em Beira..." oninput="doSearch(this.value)"><div id="exList" style="margin-top:16px;color:#666">Tendências de Beira vão aparecer aqui</div></div></div>
<div id="p-msg" class="page"><div style="padding:16px 16px 0 16px"><h3>Mensagens</h3></div><div class="mTabs"><div id="tA" class="on" onclick="setM('A')">Atividade</div><div id="tC" onclick="setM('C')">Bate-papo</div></div><div id="lA"></div><div id="lC" style="display:none"></div></div>
<div id="p-profile" class="page"><div style="padding:20px;text-align:center"><div style="width:80px;height:80px;background:#1a1a1a;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:40px">👤</div><h3 id="pN">Visitante</h3><p id="pH" style="color:#666;font-size:12px"></p></div></div>
<div id="p-search" class="page"><div style="padding:12px;display:flex;gap:8px"><input id="sAll" class="input" style="margin:0;flex:1" placeholder="Pesquisar..." oninput="doSearch(this.value)"><span style="padding:14px" onclick="showP('home')">✕</span></div><div id="sR" style="padding:16px;color:#666"></div></div>
</div>
<div class="bottom">
<div class="b-item on" id="b-home" onclick="showP('home')"><i>⌂</i>Casinha</div>
<div class="b-item" id="b-explore" onclick="showP('explore')"><i>◷</i>Explorar</div>
<div class="b-item" id="b-msg" onclick="showP('msg')"><i>💬</i>Mensagem</div>
<div class="b-item" id="b-profile" onclick="showP('profile')"><i>👤</i>Eu</div>
</div>
<div id="auth" class="auth">
<h1 style="margin-top:30px">BellApp 🔔</h1><p style="color:#777">O TikTok de Beira</p>
<div class="tabs"><div id="tE" class="on" onclick="setTab('E')">Email</div><div id="tP" onclick="setTab('P')">Número</div></div>
<div id="bE"><input id="email" class="input" placeholder="teu@email.com"></div>
<div id="bP" style="display:none"><div style="display:flex;gap:8px"><select id="cc" class="input" style="width:135px"><option value="+258">🇲🇿 +258 MZ</option><option value="+55">🇧🇷 +55 BR</option><option value="+351">🇵🇹 +351 PT</option><option value="+244">🇦🇴 +244 AO</option><option value="+27">🇿🇦 +27 ZA</option><option value="+1">🇺🇸 +1 USA</option><option value="+44">🇬🇧 +44 UK</option><option value="+91">🇮🇳 +91 IN</option></select><input id="phone" class="input" style="flex:1" placeholder="821234567"></div></div>
<input id="pass" class="input" type="password" maxlength="6" placeholder="Senha obrigatória 6 dígitos ex: 123456">
<p id="err" style="color:#ff4444;display:none;margin-top:8px;font-size:13px"></p>
<button class="btn" onclick="doAuth()">Criar conta / Entrar</button>
<p style="color:#333;font-size:11px;text-align:center;margin-top:12px">Aceita qualquer país do mundo • App limpa</p>
</div>
<div id="otpS" class="otp">
<h2 style="margin-top:30px">Confirma teu número</h2>
<p id="otpInfo" style="color:#777;margin-top:8px">Enviamos código de 6 dígitos para</p><b id="otpT" style="margin-top:10px;display:block"></b>
<div id="otpCode" style="background:#fff;color:#000;padding:14px;border-radius:10px;text-align:center;margin-top:14px;font-weight:700;letter-spacing:5px;font-size:22px">------</div>
<input id="otpI" class="input" style="text-align:center;letter-spacing:12px;font-size:22px;font-weight:700" maxlength="6" placeholder="000000">
<p id="otpE" style="color:#ff4444;display:none;margin-top:8px;font-size:13px"></p>
<button class="btn" onclick="verOtp()">Confirmar código</button>
<button style="background:transparent;color:#666;border:0;margin-top:12px;width:100%" onclick="document.getElementById('otpS').style.display='none'">← Voltar</button>
</div>
<script>
let tab='E',mt='A',tmp=null,otp='',user=JSON.parse(localStorage.getItem('bell_u')||'null'),posts=JSON.parse(localStorage.getItem('bell_p')||'[]'),atvs=JSON.parse(localStorage.getItem('bell_a')||'[]'),chats=JSON.parse(localStorage.getItem('bell_c')||'[]');
function setTab(t){tab=t;document.getElementById('tE').className=t=='E'?'on':'';document.getElementById('tP').className=t=='P'?'on':'';document.getElementById('bE').style.display=t=='E'?'block':'none';document.getElementById('bP').style.display=t=='P'?'block':'none'}
function showP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+id).classList.add('active');document.querySelectorAll('.b-item').forEach(b=>b.classList.remove('on'));let el=document.getElementById('b-'+id);if(el)el.classList.add('on');if(id=='home')rH();if(id=='msg')rM()}
function setM(t){mt=t;document.getElementById('tA').className=t=='A'?'on':'';document.getElementById('tC').className=t=='C'?'on':'';document.getElementById('lA').style.display=t=='A'?'block':'none';document.getElementById('lC').style.display=t=='C'?'block':'none'}
function doAuth(){let p=document.getElementById('pass').value,er=document.getElementById('err');if(!/^\d{6}$/.test(p)){er.style.display='block';er.textContent='Senha OBRIGATÓRIA 6 NÚMEROS! Ex: 123456';return}if(tab=='E'){let e=document.getElementById('email').value;if(!e.includes('@')){er.style.display='block';er.textContent='Email inválido';return}tmp={name:e.split('@')[0],full:e};finish()}else{let cc=document.getElementById('cc').value,ph=document.getElementById('phone').value;if(ph.length<7){er.style.display='block';er.textContent='Número inválido';return}let full=cc+' '+ph;tmp={name:full,full:full};otp=Math.floor(100000+Math.random()*900000).toString();document.getElementById('otpT').textContent=full;document.getElementById('otpCode').textContent=otp;document.getElementById('otpInfo').textContent='Enviamos código de 6 dígitos para '+full;document.getElementById('otpS').style.display='flex';}}
function verOtp(){let i=document.getElementById('otpI').value,e=document.getElementById('otpE');if(i!==otp){e.style.display='block';e.textContent='Código errado! Código certo é: '+otp;return}finish()}
function finish(){user=tmp;localStorage.setItem('bell_u',JSON.stringify(user));document.getElementById('auth').style.display='none';document.getElementById('otpS').style.display='none';document.getElementById('pN').textContent=user.name;document.getElementById('pH').textContent=user.full;rH();rM()}
function rH(){let c=document.getElementById('p-home');if(posts.length==0){c.innerHTML='<div style=height:70%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#555;padding:30px;text-align:center><div style=font-size:60px>🏠</div><h3 style=color:#fff>App nova e limpa</h3><p>Nenhum vício ainda<br>Seja o primeiro de Beira</p><button style=background:#fff;color:#000;border:0;padding:12px 20px;border-radius:20px;margin-top:12px;font-weight:700 onclick=cP()>+ Postar primeiro vício</button></div>';return}c.innerHTML=posts.map(p=>'<div style=padding:14px;border-bottom:1px solid #111><b>'+p.user+'</b><div>'+p.text+'</div></div>').join('')}
function cP(){let t=prompt('O que acontece em Beira?');if(!t)return;posts.unshift({user:user.name,text:t});localStorage.setItem('bell_p',JSON.stringify(posts));atvs.unshift({text:'Você postou: '+t,time:'agora'});localStorage.setItem('bell_a',JSON.stringify(atvs));rH();rM()}
function rM(){document.getElementById('lA').innerHTML=atvs.length?atvs.map(a=>'<div class=item><div class=avatar>🔔</div><div><b>Atividade</b><div style=color:#aaa;font-size:13px>'+a.text+'</div><div style=color:#555;font-size:11px>'+a.time+'</div></div></div>').join(''):'<div style=text-align:center;padding:40px;color:#555>🔔<br>Nenhuma atividade<br><span style=font-size:12px>Quem seguir e curtir teu vídeo aparece aqui</span></div>';document.getElementById('lC').innerHTML=chats.length?chats.map(c=>'<div class=item><div class=avatar>👤</div><div style=flex:1><div style=display:flex;justify-content:space-between><b>'+c.name+'</b><span style=color:#555;font-size:11px>'+c.time+'</span></div><div style=color:#888;font-size:13px>'+c.msg+'</div></div></div>').join(''):'<div style=text-align:center;padding:40px;color:#555>💬<br>Bate-papo vazio<br><span style=font-size:12px>Ex: beljo a 1h vai aparecer aqui</span><br><button style=background:#111;color:#fff;border:1px solid #222;padding:8px 14px;border-radius:20px;margin-top:12px onclick=\"testMsg()\">Testar beljo a 1h</button></div>'}
function testMsg(){chats.unshift({name:'beljo',msg:'E aí mano, já postaste?',time:'a 1h'});atvs.unshift({text:'beljo começou a seguir você',time:'a 1h'});localStorage.setItem('bell_c',JSON.stringify(chats));localStorage.setItem('bell_a',JSON.stringify(atvs));rM()}
function doSearch(q){let r=document.getElementById('sR'),e=document.getElementById('exList'),o=q?posts.filter(p=>p.text.toLowerCase().includes(q.toLowerCase())):[];let h=!q?'<div style=color:#555>Digita...</div>':o.length?o.map(x=>'<div style=padding:12px;border-bottom:1px solid #111>'+x.text+'</div>').join(''):'<div style=color:#555;text-align:center;padding:20px>Nada pra \"'+q+'\"</div>';if(r)r.innerHTML=h;if(e)e.innerHTML=h}
if(user){document.getElementById('auth').style.display='none';document.getElementById('pN').textContent=user.name;document.getElementById('pH').textContent=user.full}rH();rM();
</script>
</body>
  </html>
